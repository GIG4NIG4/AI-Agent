<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harvest Dashboard | AgriMind AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body class="dashboard-container">

    <aside class="sidebar">
        <div class="logo-section">
            <div class="w-8 h-8 bg-[#C8E664] rounded-full flex items-center justify-center text-black">V</div>
            <span>Harvest</span>
        </div>
        <nav class="nav-menu">
            <a href="#" class="nav-item active">Dashboard</a>
            <a href="#" class="nav-item">Analytics</a>
            <a href="#" class="nav-item">Harvest</a>
            <a href="#" class="nav-item">Schedules</a>
        </nav>
        <div class="mt-auto pt-10">
            <button class="nav-item opacity-50 hover:opacity-100 text-left">Log Out</button>
        </div>
    </aside>

    <main class="flex-1 flex flex-col overflow-y-auto">
        <header class="p-6 flex justify-between items-center bg-white shadow-sm">
            <div class="relative w-1/2">
                <input type="text" id="locationInput" value="Kendari"
                    class="w-full bg-gray-100 rounded-full px-10 py-2 focus:outline-none"
                    placeholder="Search location...">
            </div>
        </header>

        <div class="p-8 grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="card">
                <h3 class="card-title">Weather's today</h3>
                <div class="flex justify-between items-center mt-2">
                    <div>
                        <p class="font-bold" id="dayLabel">Today</p>
                        <p class="text-4xl font-bold mt-2" id="tempDisplay">29°C</p>
                    </div>
                    <div
                        class="w-20 h-20 border-8 border-[#0B2E26] border-r-[#C8E664] rounded-full flex items-center justify-center">
                        <span class="text-xs font-bold" id="humidityDisplay">86%</span>
                    </div>
                </div>
            </div>

            <div class="card">
                <h3 class="card-title">AI Health Diagnosis</h3>
                <div id="loading" class="hidden text-xs text-orange-500 animate-pulse mt-2">Analyzing plant...</div>
                <div class="mt-2">
                    <p class="font-bold text-lg" id="diagnosisLabel">-</p>
                    <p class="text-xs text-gray-500" id="riskLabel">Upload image to start</p>
                </div>
                <ul id="actionPlan" class="mt-3 text-[10px] space-y-1 text-gray-600"></ul>
            </div>

            <div class="card p-0 overflow-hidden relative border-2 border-dashed border-gray-200">
                <img id="previewImage"
                    src="https://images.unsplash.com/photo-1523348837708-15d4a09cfac2?auto=format&fit=crop&q=80&w=400"
                    class="object-cover w-full h-full cursor-pointer hover:opacity-90 transition"
                    onclick="openCaptureModal()">
                <div class="absolute bottom-2 left-2 bg-black/50 text-white text-[10px] px-2 py-1 rounded">Click to
                    Capture/Upload</div>
            </div>

            <div class="md:col-span-2 card">
                <h3 class="text-xl font-bold mb-4">Health Index Trend</h3>
                <div class="h-48 health-bar-container">
                    <div id="healthBar" class="health-bar-fill" style="height: 10%"></div>
                </div>
                <p class="text-center mt-4 font-bold" id="healthScore">Score: 0</p>
            </div>

            <div class="card bg-[#0B2E26] flex flex-col justify-center items-center text-white">
                <p class="text-xs mb-4 opacity-70">Ready to check your crops?</p>
                <button id="analyzeBtn" class="btn-analyze">
                    🚀 Analyze Now
                </button>
            </div>
        </div>
    </main>

    <div id="captureModal" class="fixed inset-0 bg-black/80 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-[2rem] p-6 max-w-md w-full">
            <h3 class="text-lg font-bold mb-4 text-center">Select Source</h3>
            <div class="grid grid-cols-2 gap-4">
                <button id="galleryBtn"
                    class="flex flex-col items-center p-4 border-2 border-dashed border-gray-200 rounded-2xl hover:bg-gray-50">
                    <span class="text-2xl">📁</span>
                    <span class="text-xs font-bold mt-2">Gallery</span>
                </button>
                <button id="cameraBtn"
                    class="flex flex-col items-center p-4 border-2 border-dashed border-gray-200 rounded-2xl hover:bg-gray-50">
                    <span class="text-2xl">📸</span>
                    <span class="text-xs font-bold mt-2">Camera</span>
                </button>
            </div>
            <div id="cameraContainer" class="hidden mt-4">
                <video id="video" class="w-full rounded-xl bg-black" autoplay></video>
                <button id="snapBtn" class="w-full bg-[#0B2E26] text-white py-2 rounded-lg mt-2 font-bold">Capture
                    Photo</button>
            </div>
            <button id="closeModalBtn" class="w-full mt-6 text-gray-400 text-sm">Cancel</button>
        </div>
    </div>

    <input type="file" id="imageInput" class="hidden" accept="image/*">
    <canvas id="canvas" class="hidden"></canvas>

    <script src="script.js"></script>
</body>

</html>
